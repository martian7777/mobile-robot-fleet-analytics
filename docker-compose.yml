# =============================================================================
# Fleet Analytics Dashboard for Mobile Robots (AMRs)
# Three services: PostgreSQL · FastAPI backend (+ dashboard) · AMR simulator.
# Bring everything up with:  docker-compose up --build
# Then open  http://localhost:8000
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: fleet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    ports:
      - "5432:5432"          # exposed for Power BI / DirectQuery
    volumes:
      - fleet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      # Root context so the image can build the Vite + React frontend too.
      context: .
      dockerfile: backend/Dockerfile
    container_name: fleet-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://fleet:fleet@db:5432/fleet
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"          # dashboard + REST + WebSockets

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: fleet-simulator
    restart: unless-stopped
    environment:
      API_BASE: http://backend:8000
      WS_URL: ws://backend:8000/ws/simulator
      SIM_TICK: "0.5"
      TELEMETRY_EVERY: "1.0"
    depends_on:
      backend:
        condition: service_started

volumes:
  fleet_pgdata:
